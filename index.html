<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DE Deutsch Wortschatz — Glossar (Tag 01–40)</title>
  <div>Deutsch Elite - Hridoy</div>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1e40af;
      --border: #e2e8f0;

      /* Article Colors */
      --der-main: #2563eb;
      --der-bg: #eff6ff;
      --der-border: #bfdbfe;

      --die-main: #e11d48;
      --die-bg: #fff1f2;
      --die-border: #fecdd3;

      --das-main: #059669;
      --das-bg: #ecfdf5;
      --das-border: #a7f3d0;

      --none-main: #64748b;
      --none-bg: #f8fafc;
      --none-border: #cbd5e1;

      --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Noto Serif Bengali', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: #ffffff;
      padding: 26px 16px 34px;
      text-align: center;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    header p {
      color: #cbd5e1;
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .legend-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      font-size: 0.8rem;
    }

    .legend-pill {
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
      color: #fff;
    }

    .container {
      max-width: 1140px;
      margin: -20px auto 0;
      padding: 0 16px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box .num {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-box .lbl {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .controls-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    input, select, button {
      font-family: inherit;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.93rem;
      background: #fff;
      color: var(--text);
    }

    /* Dictionary Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .word-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top-width: 5px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: transform 0.15s ease;
    }

    .word-card:hover {
      transform: translateY(-2px);
    }

    .theme-der { border-top-color: var(--der-main); }
    .theme-die { border-top-color: var(--die-main); }
    .theme-das { border-top-color: var(--das-main); }
    .theme-none { border-top-color: var(--none-main); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .tag-pill {
      font-size: 0.78rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #334155;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .art-pill {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      color: #fff;
    }

    .pill-der { background: var(--der-main); }
    .pill-die { background: var(--die-main); }
    .pill-das { background: var(--das-main); }
    .pill-none { background: var(--none-main); }

    .word-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
    }

    .german-title {
      font-size: 1.38rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .txt-der { color: var(--der-main); }
    .txt-die { color: var(--die-main); }
    .txt-das { color: var(--das-main); }
    .txt-none { color: var(--text); }

    .plural-line {
      font-size: 0.87rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .plural-line strong {
      color: var(--text);
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: #e2e8f0;
    }

    .audio-btn.speaking {
      background: #dbeafe;
      border-color: var(--der-main);
      color: var(--der-main);
    }

    .meaning-block {
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      padding: 10px 0;
    }

    .bn-text {
      font-size: 1.08rem;
      font-weight: 700;
      color: #0f172a;
    }

    .en-text {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .example-card {
      background: #f8fafc;
      border-left: 3px solid #94a3b8;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.88rem;
    }

    .theme-der .example-card { background: var(--der-bg); border-left-color: var(--der-main); }
    .theme-die .example-card { background: var(--die-bg); border-left-color: var(--die-main); }
    .theme-das .example-card { background: var(--das-bg); border-left-color: var(--das-main); }

    .ex-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .ex-de {
      font-weight: 700;
      color: #1e293b;
    }

    .ex-bn {
      color: #475569;
      margin-top: 3px;
    }

    .card-footer {
      display: flex;
      gap: 8px;
    }

    .status-btn {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    .status-btn.fav-on {
      background: #fef9c3;
      border-color: #eab308;
      color: #854d0e;
    }

    .status-btn.learn-on {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }

    /* Flashcard */
    .flash-container {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
    }

    .flash-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-top-width: 6px;
      border-radius: 20px;
      padding: 32px 22px;
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      margin-bottom: 14px;
    }

    .flash-word {
      font-size: 2rem;
      font-weight: 800;
      margin: 10px 0 4px;
    }

    .flash-back {
      width: 100%;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .nav-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Quiz */
    .quiz-box {
      max-width: 620px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .quiz-opts {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .quiz-opt {
      text-align: left;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .quiz-opt.correct {
      background: #dcfce7;
      border-color: #16a34a;
      font-weight: 700;
    }

    .quiz-opt.wrong {
      background: #fee2e2;
      border-color: #dc2626;
    }

    .empty-state {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 16px;
      color: var(--muted);
    }
  </style>
</head>

    const STORAGE_KEY = "deutsch_glossar_progress_v1";
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"fav":[],"learned":[]}');
    let activeMode = "dictionary";
    let flashIdx = 0;
    let flashShowBack = false;
    let quizData = null;
    let quizLocked = false;
    let quizChosen = null;

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function speakGerman(text, btnEl) {
      if (!("speechSynthesis" in window)) {
        alert("দুঃখিত, আপনার ব্রাউজার অডিও উচ্চারণ সমর্থন করছে না।");
        return;
      }
      window.speechSynthesis.cancel();
      document.querySelectorAll(".audio-btn.speaking").forEach(b => b.classList.remove("speaking"));

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "de-DE";
      utter.rate = 0.92;

      const voices = window.speechSynthesis.getVoices();
      const deVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("de"));
      if (deVoice) utter.voice = deVoice;

      if (btnEl) {
        btnEl.classList.add("speaking");
        utter.onend = () => btnEl.classList.remove("speaking");
        utter.onerror = () => btnEl.classList.remove("speaking");
      }
      window.speechSynthesis.speak(utter);
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function escapeAttr(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function getTheme(art) {
      if (art === "der") return { card: "theme-der", pill: "pill-der", txt: "txt-der", label: "der" };
      if (art === "die") return { card: "theme-die", pill: "pill-die", txt: "txt-die", label: "die" };
      if (art === "das") return { card: "theme-das", pill: "pill-das", txt: "txt-das", label: "das" };
      return { card: "theme-none", pill: "pill-none", txt: "txt-none", label: "ohne Artikel" };
    }

    function getFilteredList() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const day = document.getElementById("dayFilter").value;
      const art = document.getElementById("artikelFilter").value;
      const status = document.getElementById("statusFilter").value;

      return vocabularyData
        .filter(item => {
          if (day !== "ALL" && item.day !== day) return false;
          if (art !== "ALL" && item.artikel !== art) return false;
          const isFav = state.fav.includes(item.id);
          const isLearned = state.learned.includes(item.id);
          if (status === "FAV" && !isFav) return false;
          if (status === "LEARNED" && !isLearned) return false;
          if (status === "UNLEARNED" && isLearned) return false;

          if (q) {
            const blob = `${item.artikel} ${item.german} ${item.plural} ${item.bangla} ${item.english} ${item.exDe} ${item.day}`.toLowerCase();
            if (!blob.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => a.day.localeCompare(b.day) || a.serial - b.serial);
    }

    function toggleFav(id) {
      state.fav = state.fav.includes(id) ? state.fav.filter(x => x !== id) : [...state.fav, id];
      persist();
      render();
    }

    function toggleLearned(id) {
      state.learned = state.learned.includes(id) ? state.learned.filter(x => x !== id) : [...state.learned, id];
      persist();
      render();
    }

    function renderDictionary(list) {
      if (!list.length) {
        return `<div class="empty-state">কোনো শব্দ পাওয়া যায়নি। সার্চ বা ফিল্টার পরিবর্তন করে দেখুন।</div>`;
      }
      return `
        <div class="cards-grid">
          ${list.map(w => {
            const t = getTheme(w.artikel);
            const isFav = state.fav.includes(w.id);
            const isLearned = state.learned.includes(w.id);
            const displayWord = w.artikel ? `${w.artikel} ${w.german}` : w.german;

            return `
              <div class="word-card ${t.card}">
                <div>
                  <div class="card-header">
                    <span class="tag-pill">${w.day} • #${w.serial}</span>
                    <span class="art-pill ${t.pill}">${t.label}</span>
                  </div>

                  <div class="word-row">
                    <div>
                      <div class="german-title ${t.txt}">${displayWord}</div>
                      <div class="plural-line">Plural: <strong>${w.plural}</strong></div>
                    </div>
                    <button class="audio-btn" onclick="speakGerman('${escapeAttr(displayWord)}', this)" title="শব্দটি শুনুন">
                      🔊 শব্দ
                    </button>
                  </div>
                </div>

                <div class="meaning-block">
                  <div class="bn-text">${w.bangla}</div>
                  <div class="en-text">${w.english}</div>
                </div>

                <div class="example-card">
                  <div class="ex-top">
                    <div class="ex-de">${w.exDe}</div>
                    <button class="audio-btn" onclick="speakGerman('${escapeAttr(w.exDe)}', this)" title="উদাহরণ বাক্যটি শুনুন">
                      🔊 বাক্য
                    </button>
                  </div>
                  <div class="ex-bn">${w.exBn}</div>
                </div>

                <div class="card-footer">
                  <button class="status-btn ${isFav ? "fav-on" : ""}" onclick="toggleFav(${w.id})">
                    ${isFav ? "★ Favorite" : "☆ Favorite"}
                  </button>
                  <button class="status-btn ${isLearned ? "learn-on" : ""}" onclick="toggleLearned(${w.id})">
                    ${isLearned ? "✓ Learned" : "Mark Learned"}
                  </button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderFlashcards(list) {
      if (!list.length) {
        return `<div class="empty-state">ফ্ল্যাশকার্ডের জন্য কোনো শব্দ নেই।</div>`;
      }
      if (flashIdx >= list.length) flashIdx = 0;
      const w = list[flashIdx];
      const t = getTheme(w.artikel);
      const displayWord = w.artikel ? `${w.artikel} ${w.german}` : w.german;

      return `
        <div class="flash-container">
          <div class="flash-card ${t.card}" onclick="flashShowBack = !flashShowBack; render();">
            <div class="card-header" style="width:100%;">
              <span class="tag-pill">${w.day} • #${w.serial}</span>
              <span class="art-pill ${t.pill}">${t.label}</span>
            </div>

            <div class="flash-word ${t.txt}">${displayWord}</div>
            <div class="plural-line">Plural: <strong>${w.plural}</strong></div>

            <div style="margin-top:10px;" onclick="event.stopPropagation();">
              <button class="audio-btn" onclick="speakGerman('${escapeAttr(displayWord)}', this)">🔊 উচ্চারণ শুনুন</button>
            </div>

            ${flashShowBack ? `
              <div class="flash-back">
                <div class="bn-text">${w.bangla}</div>
                <div class="en-text">${w.english}</div>
                <div class="example-card" style="margin-top:10px; text-align:left;" onclick="event.stopPropagation();">
                  <div class="ex-top">
                    <div class="ex-de">${w.exDe}</div>
                    <button class="audio-btn" onclick="speakGerman('${escapeAttr(w.exDe)}', this)">🔊 বাক্য</button>
                  </div>
                  <div class="ex-bn">${w.exBn}</div>
                </div>
              </div>
            ` : `<div class="en-text" style="margin-top:14px;">(অর্থ ও উদাহরণ দেখতে কার্ডে ক্লিক করুন)</div>`}
          </div>

          <div class="nav-btns">
            <button class="mode-btn" onclick="flashIdx = (flashIdx - 1 + ${list.length}) % ${list.length}; flashShowBack = false; render();">← আগেরটি</button>
            <button class="primary-btn" onclick="flashShowBack = !flashShowBack; render();">${flashShowBack ? "প্রশ্ন দেখুন" : "উত্তর দেখুন"}</button>
            <button class="mode-btn" onclick="flashIdx = (flashIdx + 1) % ${list.length}; flashShowBack = false; render();">পরেরটি →</button>
          </div>
          <div class="plural-line" style="margin-top:10px;">কার্ড ${flashIdx + 1} / ${list.length}</div>
        </div>
      `;
    }

    function createQuiz(list) {
      if (list.length < 4) return;
      quizLocked = false;
      quizChosen = null;
      const target = list[Math.floor(Math.random() * list.length)];
      const others = list.filter(x => x.id !== target.id).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [...others, target].sort(() => Math.random() - 0.5);
      quizData = { target, options };
    }

    function answerQuiz(id) {
      if (quizLocked) return;
      quizLocked = true;
      quizChosen = id;
      render();
    }

    function renderQuiz(list) {
      if (list.length < 4) {
        return `<div class="empty-state">কুইজ খেলার জন্য কমপক্ষে ৪টি শব্দ থাকতে হবে।</div>`;
      }
      if (!quizData || !list.some(x => x.id === quizData.target.id)) {
        createQuiz(list);
      }
      const { target, options } = quizData;
      const t = getTheme(target.artikel);
      const displayWord = target.artikel ? `${target.artikel} ${target.german}` : target.german;

      return `
        <div class="quiz-box">
          <div class="card-header">
            <span class="tag-pill">${target.day} • #${target.serial}</span>
            <span class="art-pill ${t.pill}">${t.label}</span>
          </div>

          <div class="word-row" style="margin-top:12px;">
            <div class="german-title ${t.txt}">"${displayWord}" এর অর্থ কী?</div>
            <button class="audio-btn" onclick="speakGerman('${escapeAttr(displayWord)}', this)">🔊 শুনুন</button>
          </div>

          <div class="quiz-opts">
            ${options.map(opt => {
              let cls = "quiz-opt";
              if (quizLocked) {
                if (opt.id === target.id) cls += " correct";
                else if (quizChosen === opt.id) cls += " wrong";
              }
              return `
                <button class="${cls}" onclick="answerQuiz(${opt.id})">
                  ${opt.bangla} <span style="color:#64748b;">(${opt.english})</span>
                </button>
              `;
            }).join("")}
          </div>

          ${quizLocked ? `
            <div style="margin-top:14px; text-align:right;">
              <button class="primary-btn" onclick="createQuiz(getFilteredList()); render();">পরবর্তী প্রশ্ন →</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    function render() {
      const list = getFilteredList();
      document.getElementById("stTotal").textContent = vocabularyData.length;
      document.getElementById("stShown").textContent = list.length;
      document.getElementById("stLearned").textContent = state.learned.length;
      document.getElementById("stFav").textContent = state.fav.length;

      const container = document.getElementById("appContent");
      if (activeMode === "dictionary") container.innerHTML = renderDictionary(list);
      else if (activeMode === "flashcard") container.innerHTML = renderFlashcards(list);
      else if (activeMode === "quiz") container.innerHTML = renderQuiz(list);
    }

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeMode = btn.dataset.mode;
        flashShowBack = false;
        createQuiz(getFilteredList());
        render();
      });
    });

    ["searchInput", "dayFilter", "artikelFilter", "statusFilter"].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("input", () => {
        flashIdx = 0;
        flashShowBack = false;
        createQuiz(getFilteredList());
        render();
      });
      el.addEventListener("change", () => {
        flashIdx = 0;
        flashShowBack = false;
        createQuiz(getFilteredList());
        render();
      });
    });

    createQuiz(vocabularyData);
    render();
  </script>
</body>
</html>
